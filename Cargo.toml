[workspace]
resolver = "2"
members  = [
    "main/features/bench",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.95"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/edge"

[workspace.dependencies]
serde       = { version = "1.0", features = ["derive"] }
thiserror   = "2"
futures     = "0.3"
tokio       = { version = "1.0", features = ["rt", "sync", "time", "macros", "rt-multi-thread"] }
toml        = "0.8"

edge-domain = { git = "ssh://git@github.com/sweengineeringlabs/edge.git", tag = "v0.4.5" }

[workspace.lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"
